name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/build.yml'
      - '.releaserc.json'
      - 'build.gradle.kts'
      - 'package.json'
      - 'package-lock.json'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'CHANGELOG.md'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'src/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install release dependencies
        run: npm ci

      - name: Determine build version
        id: version
        shell: bash
        run: |
          base_version="$(grep '^version=' gradle.properties | cut -d= -f2-)"
          short_sha="${GITHUB_SHA::7}"
          build_number="${GITHUB_RUN_NUMBER}"

          if [[ "${GITHUB_REF}" == refs/tags/v*-beta ]]; then
            tagged_version="${GITHUB_REF_NAME#v}"
            base_version="${tagged_version%-beta}"
            version="${base_version}b-${short_sha}-b${build_number}"
            release_name="${version}"
            prerelease="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_name="${version}"
            prerelease="false"
          elif [[ "${GITHUB_REF}" == refs/heads/master ]]; then
            version="${base_version}a-${short_sha}-b${build_number}"
            release_name="${version}"
            prerelease="true"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            version="${base_version}dev-${short_sha}-b${build_number}"
            release_name="${version}"
            prerelease="true"
          else
            version="${base_version}-SNAPSHOT+${short_sha}"
            release_name="${version}"
            prerelease="false"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
