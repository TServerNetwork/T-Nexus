tnexus:
  database:
    host: "localhost"
    port: 3306
    name: "tnexus"
    username: "root"
    password: ""
    table-prefix: "tnexus_"
    pool-size: 10
  server:
    default-world: "lobby"
  economy:
    currency-name: "コイン"
    currency-symbol: "¥"
    starting-balance: 1000.0
  afk:
    score:
      threshold: 100
      max: 100
      decay-per-second: 2
    timeout-seconds: 300
  gui:
    main-menu-title: "&6&lT-Nexus メニュー"
    items-per-page: 45
    header-item: "BLACK_STAINED_GLASS_PANE"
    border-item: "GRAY_STAINED_GLASS_PANE"
    click-cooldown-millis: 200
    prev-page-slot: 45
    back-button-slot: 48
    close-button-slot: 49
    current-location-slot: 50
    next-page-slot: 53
    pager-textures:
      previous:
        enabled: "REPLACE_PREVIOUS_ENABLED_TEXTURE"
        disabled: "REPLACE_PREVIOUS_DISABLED_TEXTURE"
      next:
        enabled: "REPLACE_NEXT_ENABLED_TEXTURE"
        disabled: "REPLACE_NEXT_DISABLED_TEXTURE"
  shop:
    player-shop:
      default-limit: 5
    sign-display:
      item-name-max-length: 13
    link-tool:
      material: "STICK"
    server-shop:
      sell-to-void: true
    banned-materials:
      - "STICK"
      - "COMMAND_BLOCK"
      - "BARRIER"
      - "DEBUG_STICK"
      - "BEDROCK"
      - "STRUCTURE_VOID"
      - "JIGSAW"
  locale: "ja_JP"

resource-world:
  backup-path: "plugins/T-Nexus/backups"
  backup-generations: 3
  fallback-world: "lobby"
  seed-obfuscation-key: 1234567890
  show-real-seed-to-admin: false
  spawn:
    schematic:
      ignore-air-blocks: true
      air-marker-block: "minecraft:magenta_concrete"
      replace-air-marker-after-paste: true
  worlds:
    - name: "resource"
      dimension: "NORMAL"
      reset-interval-days: 90
      reset-start-date: "2026-01-01T04:00:00"
    - name: "resource_nether"
      dimension: "NETHER"
      reset-interval-days: 90
      reset-start-date: "2026-02-01T04:00:00"
    - name: "resource_end"
      dimension: "THE_END"
      reset-interval-days: 90
      reset-start-date: "2026-03-01T04:00:00"
